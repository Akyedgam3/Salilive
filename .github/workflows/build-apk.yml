name: Build APK and publish site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'website/**', '.github/workflows/build-apk.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: app
        run: flutter create . --platforms=android --org live.salli --project-name sallilive
      - name: Patch manifest
        working-directory: app
        run: python3 tools/patch_manifest.py
      - name: Build icons
        working-directory: app
        run: |
          pip install pillow
          python3 tools/make_icons.py
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: dart run flutter_launcher_icons
      - name: Build release APK
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set +e
          U=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          K=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          [ -z "$U" ] && echo "::error::SUPABASE_URL secret is empty"
          [ -z "$K" ] && echo "::error::SUPABASE_ANON_KEY secret is empty"
          flutter build apk --release --no-shrink --dart-define=SUPABASE_URL="$U" --dart-define=SUPABASE_ANON_KEY="$K" 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "rror|FAILURE|went wrong|Could not|lib/.*\.dart" build.log | tr -d '\r' | head -20 | while IFS= read -r l; do printf '::error::%s\n' "$l"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: sallilive-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Assemble website
        run: cp app/build/app/outputs/flutter-apk/app-release.apk website/sallilive.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
# repo public, pages enabled
