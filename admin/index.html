<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalliLive Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#0b0b1a;--card:#16162b;--line:#26264a;--txt:#f1f1f8;--mut:#9a9ab8;--pink:#ff2d75;--purple:#7b2ff7;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:linear-gradient(135deg,var(--pink),var(--purple));border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
button.sec{background:var(--line)} button.bad{background:var(--bad)} button.ok{background:var(--ok)} button.sm{padding:4px 10px;font-size:12px}
input,select,textarea{background:#0f0f24;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px}
#login{max-width:340px;margin:12vh auto;background:var(--card);padding:28px;border-radius:18px}
#login h1{margin:0 0 6px;font-size:22px;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;color:transparent}
#app{display:none;min-height:100vh}
aside{position:fixed;top:0;right:0;bottom:0;width:210px;background:var(--card);padding:16px 10px;overflow:auto}
aside .logo{font-weight:800;font-size:20px;padding:6px 12px 16px;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;color:transparent}
aside a{display:block;padding:10px 12px;border-radius:10px;color:var(--mut);cursor:pointer;margin-bottom:2px}
aside a.on,aside a:hover{background:#20203f;color:var(--txt)}
main{margin-right:210px;padding:22px}
@media(max-width:760px){aside{position:static;width:auto;display:flex;flex-wrap:wrap;gap:4px}aside .logo{width:100%}aside a{margin:0}main{margin-right:0}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar h2{margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.stat{background:var(--card);border-radius:14px;padding:16px}.stat b{display:block;font-size:26px;margin-top:6px}.stat span{color:var(--mut)}
.wrap{overflow:auto;background:var(--card);border-radius:14px}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}
td.wrapt{white-space:normal;max-width:260px}
img.th{width:38px;height:38px;border-radius:8px;object-fit:cover}
.chip{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--line)}
.chip.pending{background:#a16207}.chip.approved{background:#15803d}.chip.rejected,.chip.banned{background:#b91c1c}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{background:var(--line)}.tabs button.on{background:linear-gradient(135deg,var(--pink),var(--purple))}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal .box{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;padding:10px 18px;border-radius:12px;display:none;z-index:10}
.row{display:flex;gap:8px;margin-top:16px}.row>*{flex:1}
</style>
</head>
<body>
<div id="login">
  <h1>SalliLive Admin</h1>
  <div style="color:var(--mut)">لوحة التحكم</div>
  <label>البريد الإلكتروني</label><input id="em" type="email" autocomplete="username">
  <label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password">
  <div class="row"><button id="go">دخول</button></div>
  <div id="lerr" style="color:var(--bad);margin-top:10px"></div>
</div>

<div id="app">
  <aside id="nav"></aside>
  <main id="main"></main>
</div>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script>
const sb = supabase.createClient(CONFIG.url, CONFIG.anon);
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const main = $("#main");
const fmt = (d) => new Date(d).toLocaleString("ar", { dateStyle: "short", timeStyle: "short" });
const num = (n) => Number(n || 0).toLocaleString("en");

function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => (t.style.display = "none"), 2600); }
function modal(html) { $("#box").innerHTML = html; $("#modal").style.display = "flex"; }
function closeModal() { $("#modal").style.display = "none"; }
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
async function run(p, ok) { const { error, data } = await p; if (error) { toast("خطأ: " + error.message); return null; } if (ok) toast(ok); return data ?? true; }

/* ---------- auth ---------- */
$("#go").onclick = async () => {
  $("#lerr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
  if (error) return ($("#lerr").textContent = error.message);
  boot();
};
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const { data: p } = await sb.from("profiles").select("is_admin").eq("id", session.user.id).single();
  if (!p?.is_admin) { await sb.auth.signOut(); $("#lerr").textContent = "هذا الحساب ليس أدمن"; return; }
  $("#login").style.display = "none"; $("#app").style.display = "block";
  buildNav(); go(location.hash.slice(1) || "dash");
}

/* ---------- nav ---------- */
const PAGES = [
  ["dash", "لوحة المعلومات"], ["users", "المستخدمين"], ["rooms", "الغرف المباشرة"], ["recharge", "طلبات الشحن"],
  ["packages", "باقات الكوينز"], ["methods", "طرق الدفع"], ["gifts", "الهدايا"], ["banners", "البانرات"],
  ["reports", "البلاغات"], ["settings", "الإعدادات"],
];
function buildNav() {
  $("#nav").innerHTML = '<div class="logo">SalliLive</div>' + PAGES.map(([k, t]) => `<a data-k="${k}">${t}</a>`).join("") + '<a id="out">تسجيل خروج</a>';
  document.querySelectorAll("#nav a[data-k]").forEach((a) => (a.onclick = () => go(a.dataset.k)));
  $("#out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
}
function go(k) {
  location.hash = k;
  document.querySelectorAll("#nav a[data-k]").forEach((a) => a.classList.toggle("on", a.dataset.k === k));
  main.innerHTML = '<div style="color:var(--mut)">جاري التحميل…</div>';
  (views[k] || views.dash)();
}

/* ---------- views ---------- */
const views = {
  async dash() {
    const s = await run(sb.rpc("admin_stats")); if (!s) return;
    const card = (t, v) => `<div class="stat"><span>${t}</span><b>${v}</b></div>`;
    main.innerHTML = `<div class="bar"><h2>لوحة المعلومات</h2></div><div class="cards">
      ${card("المستخدمين", num(s.users))}${card("جدد اليوم", num(s.users_today))}${card("غرف مباشرة الآن", num(s.live_rooms))}
      ${card("طلبات شحن معلّقة", num(s.pending_recharges))}${card("كوينز مباعة", num(s.coins_sold))}${card("الإيرادات", num(s.revenue))}
      ${card("هدايا مرسلة", num(s.gifts_sent))}${card("بلاغات مفتوحة", num(s.open_reports))}</div>`;
  },

  async users(q = "") {
    let query = sb.from("profiles").select("*, wallets(coins,diamonds)").order("created_at", { ascending: false }).limit(60);
    if (q) query = /^\d+$/.test(q) ? query.eq("display_id", q) : query.ilike("name", `%${q}%`);
    const rows = await run(query); if (!rows) return;
    main.innerHTML = `<div class="bar"><h2>المستخدمين</h2><div style="display:flex;gap:6px"><input id="q" placeholder="ابحث بالاسم أو الـ ID" value="${esc(q)}"><button id="sq">بحث</button></div></div>
      <div class="wrap"><table><tr><th></th><th>ID</th><th>الاسم</th><th>كوينز</th><th>ماس</th><th>الحالة</th><th>تسجيل</th><th></th></tr>
      ${rows.map((u) => { const w = Array.isArray(u.wallets) ? u.wallets[0] : u.wallets || {};
        return `<tr><td>${u.avatar_url ? `<img class="th" src="${esc(u.avatar_url)}">` : ""}</td><td>${u.display_id}</td><td>${esc(u.name)} ${u.is_admin ? '<span class="chip">أدمن</span>' : ""}</td>
        <td>${num(w.coins)}</td><td>${num(w.diamonds)}</td><td>${u.is_banned ? '<span class="chip banned">محظور</span>' : "نشط"}</td><td>${fmt(u.created_at)}</td>
        <td><button class="sm sec" data-a="coins" data-id="${u.id}">كوينز</button> <button class="sm ${u.is_banned ? "ok" : "bad"}" data-a="ban" data-id="${u.id}" data-b="${u.is_banned}">${u.is_banned ? "رفع الحظر" : "حظر"}</button></td></tr>`; }).join("")}
      </table></div>`;
    $("#sq").onclick = () => views.users($("#q").value.trim());
    $("#q").onkeydown = (e) => e.key === "Enter" && $("#sq").click();
    main.querySelectorAll("button[data-a]").forEach((b) => (b.onclick = async () => {
      if (b.dataset.a === "ban") {
        const ban = b.dataset.b !== "true";
        if (confirm(ban ? "حظر هذا المستخدم؟" : "رفع الحظر؟") && await run(sb.rpc("admin_set_ban", { p_user: b.dataset.id, p_ban: ban }), "تم")) views.users(q);
      } else {
        const d = prompt("المبلغ (موجب للإضافة، سالب للخصم):"); if (!d || isNaN(+d)) return;
        const note = prompt("ملاحظة:") || "";
        if (await run(sb.rpc("admin_adjust_coins", { p_user: b.dataset.id, p_delta: +d, p_note: note }), "تم")) views.users(q);
      }
    }));
  },

  async rooms() {
    const rows = await run(sb.from("rooms").select("*, owner:profiles(name,display_id), room_seats(user_id)").eq("is_live", true).order("created_at", { ascending: false }));
    if (!rows) return;
    main.innerHTML = `<div class="bar"><h2>الغرف المباشرة</h2><button class="sec" onclick="views.rooms()">تحديث</button></div><div class="wrap"><table>
      <tr><th>العنوان</th><th>المالك</th><th>على المايك</th><th>آخر نبض</th><th></th></tr>
      ${rows.map((r) => `<tr><td>${esc(r.title)}</td><td>${esc(r.owner?.name)} (${r.owner?.display_id})</td><td>${r.room_seats.filter((s) => s.user_id).length}/${r.seat_count}</td><td>${fmt(r.last_ping)}</td>
      <td><button class="sm bad" data-id="${r.id}">إغلاق</button></td></tr>`).join("")}</table></div>`;
    main.querySelectorAll("button[data-id]").forEach((b) => (b.onclick = async () => { if (confirm("إغلاق الغرفة؟") && await run(sb.rpc("close_room", { p_room: b.dataset.id }), "تم الإغلاق")) views.rooms(); }));
  },

  async recharge(status = "pending") {
    const rows = await run(sb.from("recharge_requests").select("*, user:profiles(name,display_id)").eq("status", status).order("created_at", { ascending: false }).limit(100));
    if (!rows) return;
    const tabs = [["pending", "معلّقة"], ["approved", "مقبولة"], ["rejected", "مرفوضة"]];
    main.innerHTML = `<div class="bar"><h2>طلبات الشحن</h2></div><div class="tabs">${tabs.map(([k, t]) => `<button class="${k === status ? "on" : ""}" data-s="${k}">${t}</button>`).join("")}</div>
      <div class="wrap"><table><tr><th>المستخدم</th><th>الكوينز</th><th>المبلغ</th><th>الطريقة</th><th>المرجع</th><th>الإيصال</th><th>التاريخ</th><th>${status === "pending" ? "" : "ملاحظة"}</th></tr>
      ${rows.map((r) => `<tr><td>${esc(r.user?.name)} (${r.user?.display_id})</td><td>${num(r.coins)}${r.bonus ? ` +${num(r.bonus)}` : ""}</td><td>${r.amount} ${esc(r.currency)}</td><td>${esc(r.method_name)}</td>
      <td class="wrapt">${esc(r.reference)}</td><td>${r.receipt_path ? `<button class="sm sec" data-r="${esc(r.receipt_path)}">عرض</button>` : "-"}</td><td>${fmt(r.created_at)}</td>
      <td>${status === "pending" ? `<button class="sm ok" data-ok="${r.id}">قبول</button> <button class="sm bad" data-no="${r.id}">رفض</button>` : esc(r.note)}</td></tr>`).join("")}</table></div>`;
    main.querySelectorAll("[data-s]").forEach((b) => (b.onclick = () => views.recharge(b.dataset.s)));
    main.querySelectorAll("[data-r]").forEach((b) => (b.onclick = async () => {
      const { data, error } = await sb.storage.from("receipts").createSignedUrl(b.dataset.r, 300);
      if (error) return toast(error.message);
      modal(`<img src="${data.signedUrl}" style="width:100%;border-radius:12px"><div class="row"><button class="sec" onclick="closeModal()">إغلاق</button></div>`);
    }));
    main.querySelectorAll("[data-ok]").forEach((b) => (b.onclick = async () => { if (confirm("قبول الطلب وإضافة الكوينز للمستخدم؟") && await run(sb.rpc("approve_recharge", { p_id: b.dataset.ok }), "تمت الإضافة")) views.recharge(status); }));
    main.querySelectorAll("[data-no]").forEach((b) => (b.onclick = async () => { const n = prompt("سبب الرفض:"); if (n !== null && await run(sb.rpc("reject_recharge", { p_id: b.dataset.no, p_note: n }), "تم الرفض")) views.recharge(status); }));
  },

  packages: () => crud("باقات الكوينز", "coin_packages", [
    { k: "coins", t: "الكوينز", type: "number" }, { k: "bonus", t: "هدية إضافية", type: "number", def: 0 },
    { k: "price", t: "السعر", type: "number", step: "0.01" }, { k: "currency", t: "العملة", type: "text", def: "USD" },
    { k: "sort", t: "الترتيب", type: "number", def: 0 }, { k: "active", t: "فعّال", type: "bool", def: true }]),

  methods: () => crud("طرق الدفع", "payment_methods", [
    { k: "icon_url", t: "الأيقونة", type: "image", bucket: "banners" }, { k: "name", t: "الاسم", type: "text" },
    { k: "details", t: "التفاصيل (رقم الحساب / تعليمات تظهر للمستخدم)", type: "textarea" },
    { k: "sort", t: "الترتيب", type: "number", def: 0 }, { k: "active", t: "فعّال", type: "bool", def: true }]),

  gifts: () => crud("الهدايا", "gifts", [
    { k: "icon", t: "الأيقونة (إيموجي أو صورة)", type: "image", bucket: "gifts" }, { k: "name", t: "الاسم", type: "text" },
    { k: "price", t: "السعر بالكوينز", type: "number" }, { k: "sort", t: "الترتيب", type: "number", def: 0 },
    { k: "active", t: "فعّال", type: "bool", def: true }]),

  banners: () => crud("البانرات", "banners", [
    { k: "image_url", t: "الصورة", type: "image", bucket: "banners" }, { k: "link", t: "رابط (اختياري)", type: "text" },
    { k: "sort", t: "الترتيب", type: "number", def: 0 }, { k: "active", t: "فعّال", type: "bool", def: true }]),

  async reports() {
    const rows = await run(sb.from("reports").select("*, reporter:profiles!reports_reporter_id_fkey(name,display_id), target:profiles!reports_target_id_fkey(name,display_id)").order("id", { ascending: false }).limit(100));
    if (!rows) return;
    main.innerHTML = `<div class="bar"><h2>البلاغات</h2></div><div class="wrap"><table><tr><th>من</th><th>ضد</th><th>السبب</th><th>الحالة</th><th>التاريخ</th><th></th></tr>
      ${rows.map((r) => `<tr><td>${esc(r.reporter?.name)} (${r.reporter?.display_id})</td><td>${esc(r.target?.name)} (${r.target?.display_id})</td><td class="wrapt">${esc(r.reason)}</td>
      <td><span class="chip">${r.status}</span></td><td>${fmt(r.created_at)}</td><td>${r.status === "open" ? `<button class="sm ok" data-id="${r.id}">تم الحل</button>` : ""}</td></tr>`).join("")}</table></div>`;
    main.querySelectorAll("button[data-id]").forEach((b) => (b.onclick = async () => { if (await run(sb.from("reports").update({ status: "resolved" }).eq("id", b.dataset.id), "تم")) views.reports(); }));
  },

  async settings() {
    const rows = await run(sb.from("app_settings").select("*")); if (!rows) return;
    const m = Object.fromEntries(rows.map((r) => [r.key, r.value]));
    const f = [["diamond_rate", "نسبة الماس للمضيف من قيمة الهدية (0.5 = 50%)"], ["announcement", "إعلان يظهر في التطبيق"], ["support_contact", "رابط/رقم الدعم (واتساب...)"]];
    main.innerHTML = `<div class="bar"><h2>الإعدادات</h2></div><div class="wrap" style="padding:18px;max-width:520px">${f.map(([k, t]) => `<label>${t}</label><input data-k="${k}" value="${esc(m[k])}">`).join("")}<div class="row"><button id="save">حفظ</button></div></div>`;
    $("#save").onclick = async () => {
      const up = [...main.querySelectorAll("input[data-k]")].map((i) => ({ key: i.dataset.k, value: i.value }));
      await run(sb.from("app_settings").upsert(up), "تم الحفظ");
    };
  },
};

/* ---------- generic CRUD ---------- */
async function crud(title, table, fields) {
  const rows = await run(sb.from(table).select("*").order("sort", { ascending: true })); if (!rows) return;
  const cell = (f, r) => f.type === "image" ? (/^https?:/.test(r[f.k] || "") ? `<img class="th" src="${esc(r[f.k])}">` : `<span style="font-size:26px">${esc(r[f.k])}</span>`)
    : f.type === "bool" ? (r[f.k] ? "✅" : "⛔") : esc(r[f.k]);
  main.innerHTML = `<div class="bar"><h2>${title}</h2><button id="add">+ إضافة</button></div><div class="wrap"><table><tr>${fields.map((f) => `<th>${f.t.split("(")[0]}</th>`).join("")}<th></th></tr>
    ${rows.map((r) => `<tr>${fields.map((f) => `<td class="${f.type === "textarea" ? "wrapt" : ""}">${cell(f, r)}</td>`).join("")}<td><button class="sm sec" data-e="${r.id}">تعديل</button> <button class="sm bad" data-d="${r.id}">حذف</button></td></tr>`).join("")}</table></div>`;
  const form = (r) => {
    modal(`<h3 style="margin-top:0">${r ? "تعديل" : "إضافة"}</h3>` + fields.map((f) => {
      const v = r ? r[f.k] : f.def;
      if (f.type === "bool") return `<label><input type="checkbox" id="f_${f.k}" style="width:auto" ${v ? "checked" : ""}> ${f.t}</label>`;
      if (f.type === "textarea") return `<label>${f.t}</label><textarea id="f_${f.k}" rows="5">${esc(v)}</textarea>`;
      if (f.type === "image") return `<label>${f.t}</label><input id="f_${f.k}" value="${esc(v)}" placeholder="🌹 أو رابط صورة"><input type="file" id="u_${f.k}" accept="image/*" style="margin-top:6px">`;
      return `<label>${f.t}</label><input id="f_${f.k}" type="${f.type}" ${f.step ? `step="${f.step}"` : ""} value="${esc(v)}">`;
    }).join("") + `<div class="row"><button id="ok">حفظ</button><button class="sec" onclick="closeModal()">إلغاء</button></div>`);
    $("#ok").onclick = async () => {
      const body = {};
      for (const f of fields) {
        const el = $("#f_" + f.k);
        if (f.type === "bool") body[f.k] = el.checked;
        else if (f.type === "number") body[f.k] = el.value === "" ? null : +el.value;
        else body[f.k] = el.value === "" ? null : el.value;
        if (f.type === "image") {
          const file = $("#u_" + f.k).files[0];
          if (file) {
            const path = `${Date.now()}.${(file.name.split(".").pop() || "png").toLowerCase()}`;
            const { error } = await sb.storage.from(f.bucket).upload(path, file, { upsert: true });
            if (error) return toast(error.message);
            body[f.k] = sb.storage.from(f.bucket).getPublicUrl(path).data.publicUrl;
          }
        }
      }
      const ok = r ? await run(sb.from(table).update(body).eq("id", r.id), "تم الحفظ") : await run(sb.from(table).insert(body), "تمت الإضافة");
      if (ok) { closeModal(); crud(title, table, fields); }
    };
  };
  $("#add").onclick = () => form(null);
  main.querySelectorAll("[data-e]").forEach((b) => (b.onclick = () => form(rows.find((x) => x.id === b.dataset.e))));
  main.querySelectorAll("[data-d]").forEach((b) => (b.onclick = async () => { if (confirm("حذف نهائي؟") && await run(sb.from(table).delete().eq("id", b.dataset.d), "تم الحذف")) crud(title, table, fields); }));
}

boot();
</script>
</body>
</html>
